name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install
      - run: bun run openapi:generate
      - run: bun run lint:ci
      - run: bun run typecheck
      # Each package builds against the previous one's dist/, so build in dependency order; dist/ is removed after so later steps resolve from source.
      - name: Build openapi-client and stream-import packages
        run: |
          bun run --filter @bunny.net/openapi-client build
          bun run --filter @bunny.net/stream-import build
          for pkg in vimeo s3 wistia mux cloudflare jwplayer brightcove; do
            bun run --filter "@bunny.net/stream-import-$pkg" build
          done
          rm -rf packages/openapi-client/dist packages/stream-import/dist packages/stream-import-*/dist
      - run: bun test
      - name: Build database studio
        run: bun run --filter @bunny.net/database-studio build:client
      - name: Build CLI binary
        run: bun build packages/cli/src/index.ts --compile --minify --sourcemap --outfile bunny
      - name: Build database-shell binary
        run: bun build packages/database-shell/src/cli.ts --compile --minify --sourcemap --outfile bsql
      - name: Lint install.sh (POSIX shellcheck)
        run: shellcheck -s sh install.sh
      - name: Bash syntax check install.sh
        run: bash -n install.sh
